name: Tests

# Runs the tests on every push and pull request. Deploying happens from your Mac with ./deploy.sh.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Check that the built assets are committed
        run: |
          test -f public/build/manifest.json || {
            echo "::error::public/build is missing. Run 'npm run build' locally and commit the result."
            exit 1
          }

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
